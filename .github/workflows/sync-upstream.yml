name: Sync Upstream

on:
  schedule:
    - cron: '0 8 * * *'   # 每天北京时间 16:00 同步
  workflow_dispatch:       # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream
        run: git remote add upstream https://github.com/NodeSeekDev/NodeGet-board.git

      - name: Fetch Upstream
        run: git fetch upstream

      - name: Sync Branch
        run: |
          git checkout main
          git merge upstream/main --no-edit
          git push origin main

      - name: Notify on Failure
        if: failure()
        run: echo "::error::同步失败，可能存在冲突，请手动处理！"
